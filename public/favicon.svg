<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Radial Gradients for Bioluminescent Metroid Core -->
    <radialGradient id="membraneGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#80f8ff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#00ff88" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#03070d" stop-opacity="0.8" />
    </radialGradient>
    <radialGradient id="nucleusGrad1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff6699" />
      <stop offset="60%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#660022" />
    </radialGradient>
    <radialGradient id="nucleusGrad2" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffaa66" />
      <stop offset="60%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#883300" />
    </radialGradient>
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Void Circle -->
  <circle cx="32" cy="32" r="30" fill="#03070d" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer HUD Reticle Ring & Ticks -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="4 6" stroke-opacity="0.6" />
  <path d="M32 4 L32 8 M32 56 L32 60 M4 32 L8 32 M56 32 L60 32" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Metroid Outer Biomembrane Dome -->
  <path d="M16 38 C14 22 22 14 32 14 C42 14 50 22 48 38 C42 42 38 38 32 41 C26 38 22 42 16 38 Z"
        fill="url(#membraneGrad)" stroke="#00ff88" stroke-width="1.2" filter="url(#hudGlow)" />

  <!-- Metroid Inner Nuclei (3 Bioluminescent Orbs) -->
  <circle cx="27" cy="27" r="5" fill="url(#nucleusGrad1)" />
  <circle cx="37" cy="27" r="5" fill="url(#nucleusGrad1)" />
  <circle cx="32" cy="35" r="5.5" fill="url(#nucleusGrad2)" />

  <!-- Nuclei Core Specular Highlights -->
  <circle cx="26" cy="25.5" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="36" cy="25.5" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="31" cy="33.5" r="1.5" fill="#ffffff" opacity="0.8" />

  <!-- Lower Mandibles / Fangs -->
  <path d="M22 39 C20 45 22 49 25 48 C24 45 25 42 26 40" fill="#80f8ff" />
  <path d="M42 39 C44 45 42 49 39 48 C40 45 39 42 38 40" fill="#80f8ff" />
</svg>
